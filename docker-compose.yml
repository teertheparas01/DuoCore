services:
  postgres:
    image: postgres:16-alpine
    container_name: aidflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidflow
      POSTGRES_PASSWORD: aidflow_secret_password
      POSTGRES_DB: aidflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidflow-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://aidflow:aidflow_secret_password@postgres:5432/aidflow
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
